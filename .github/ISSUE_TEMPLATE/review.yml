name: Revisar entrada
description: Actualizar una evaluación.
title: "[Revisión]: "
labels: ["catalog", "review"]
body:
  - type: input
    id: name
    attributes:
      label: Entrada
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit o release
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Hallazgos
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Resultado propuesto
      options:
        - Mantener
        - Promover
        - Degradar
        - Deprecar
    validations:
      required: true
